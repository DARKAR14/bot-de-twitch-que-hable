<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>TTS Bot - OBS</title>
  <style>
    @font-face {
      font-family: "MiFuente";
      src: url("/font/njnaruto.ttf") format("truetype");
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 30px;
      font-family: 'MiFuente', sans-serif;
      overflow: hidden;
    }

    #notificacion {
      display: none;
      position: relative;
      align-items: center;
      gap: 14px;
      background: rgba(10, 10, 20, 0.92);
      border: 2px solid #ea8352;
      border-radius: 16px;
      padding: 14px 22px;
      max-width: 520px;
      box-shadow: 0 0 30px rgba(162, 89, 255, 0.35), 0 4px 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }

    #notificacion.entrando {
      animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    #notificacion.saliendo {
      animation: slideOut 0.4s ease-in forwards;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes slideOut {
      from {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      to {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
    }

    .icono {
      font-size: 32px;
      flex-shrink: 0;
    }

    .icono img {
      width: 80px;
      height: 80px;
      animation: pulso 1s ease-in-out infinite alternate;
    }

    @keyframes pulso {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.15);
      }
    }

    .contenido {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .usuario {
      font-family: 'MiFuente', sans-serif;
      font-size: 18px;
      letter-spacing: 1.5px;
      color: #eb8352;
    }

    .mensaje {
      font-size: 15px;
      color: #f0f0f0;
      line-height: 1.4;
    }

    .cola-badge {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .barra {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #eb8352, #ea8352);
      border-radius: 0 0 14px 14px;
      width: 100%;
      transform-origin: left;
    }
  </style>
</head>

<body>

  <div id="notificacion">
    <div class="icono">
      <img src="/svg/svgviewer-output.svg"/>
    </div>
    <div class="contenido">
      <span class="usuario" id="usuario">usuario</span>
      <span class="mensaje" id="mensaje">mensaje</span>
      <span class="cola-badge" id="cola-badge"></span>
    </div>
    <div class="barra" id="barra"></div>
  </div>

  <script>
    const notif = document.getElementById('notificacion');
    const elUsuario = document.getElementById('usuario');
    const elMensaje = document.getElementById('mensaje');
    const elBadge = document.getElementById('cola-badge');
    const elBarra = document.getElementById('barra');

    const colaLocal = [];
    const idsVistos = new Set();
    let reproduciendo = false;
    let currentConfig = {};
    let ws;
    let reconnectTimer;
    let currentId = null;
    let audioActual = null;
    let utteranceActual = null;
    let finalizarActual = null;
    let ackPendiente = null;

    async function cargarConfig() {
      try {
        const resp = await fetch('/api/config');
        if (!resp.ok) throw new Error(`Status ${resp.status}`);
        currentConfig = await resp.json();
        notif.style.background = currentConfig.background;
        notif.style.borderColor = currentConfig.borderColor;
        elUsuario.style.color = currentConfig.textColor;
        elMensaje.style.color = currentConfig.messageColor;
        elBarra.style.background = currentConfig.barGradient;
      } catch (err) {
        console.warn('No se pudo cargar config:', err);
      }
    }

    function enviarTerminado(id) {
      ackPendiente = id;
      if (ws?.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ tipo: 'terminado', id }));
        return true;
      }
      return false;
    }

    function conectarWS() {
      clearTimeout(reconnectTimer);
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const token = new URLSearchParams(location.search).get('token');
      const query = token ? `?token=${encodeURIComponent(token)}` : '';
      ws = new WebSocket(`${proto}://${location.host}/ws${query}`);

      ws.onopen = () => {
        console.log('WS conectado');
        if (ackPendiente) enviarTerminado(ackPendiente);
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.tipo === 'nuevo' && typeof data.id === 'string') {
            if (idsVistos.has(data.id)) {
              // Si el ACK anterior se perdio durante una desconexion, el servidor
              // reenviara el activo. Repetimos el ACK en vez de reproducirlo otra vez.
              if (ackPendiente === data.id) enviarTerminado(data.id);
              return;
            }
            idsVistos.add(data.id);
            if (idsVistos.size > 500) idsVistos.delete(idsVistos.values().next().value);
            colaLocal.push(data);
            if (!reproduciendo) reproducirSiguiente();
          } else if (data.tipo === 'confirmado' && data.id === ackPendiente) {
            ackPendiente = null;
          } else if (data.tipo === 'cancelar') {
            colaLocal.splice(0, colaLocal.length);
            if (data.id === ackPendiente) ackPendiente = null;
            if (data.id === currentId && finalizarActual) {
              finalizarActual({ confirmar: false, cancelar: true });
            }
          }
        } catch (err) {
          console.warn('Mensaje WS invalido:', err);
        }
      };

      ws.onclose = () => {
        console.warn('WS cerrado, reconectando en 3s...');
        // Una fuente que pierde el rol principal no debe seguir sonando mientras
        // el servidor promueve otra fuente OBS. Al reconectar, el ID se puede
        // recibir de nuevo y reproducir desde un unico cliente.
        if (
          currentId &&
          finalizarActual &&
          !finalizarActual.estaFinalizado()
        ) {
          idsVistos.delete(currentId);
          finalizarActual({ confirmar: false, cancelar: true });
        }
        reconnectTimer = setTimeout(conectarWS, 3000);
      };
      ws.onerror = () => ws.close();
    }

    function limpiarReproductor() {
      if (audioActual) {
        audioActual.pause();
        audioActual.removeAttribute('src');
        audioActual.load();
      }
      audioActual = null;
      if (utteranceActual) window.speechSynthesis.cancel();
      utteranceActual = null;
    }

    function crearFinalizador(id) {
      let finalizado = false;
      let timeoutFallback = null;

      const finalizar = ({ confirmar = true, cancelar = false } = {}) => {
        if (finalizado) return;
        finalizado = true;
        if (timeoutFallback) clearTimeout(timeoutFallback);
        finalizar.timeoutFallback = null;
        if (cancelar) limpiarReproductor();
        if (confirmar) enviarTerminado(id);

        notif.classList.remove('entrando');
        notif.classList.add('saliendo');
        setTimeout(() => {
          limpiarReproductor();
          notif.style.display = 'none';
          elBarra.style.transition = '';
          elBarra.style.transform = 'scaleX(1)';
          currentId = null;
          finalizarActual = null;
          reproducirSiguiente();
        }, 400);
      };

      finalizar.setTimeoutFallback = (timer) => { timeoutFallback = timer; };
      finalizar.estaFinalizado = () => finalizado;
      return finalizar;
    }

    function reproducirSiguiente() {
      if (colaLocal.length === 0) {
        reproduciendo = false;
        return;
      }
      reproduciendo = true;
      reproducir(colaLocal.shift());
    }

    function reproducir({ id, usuario, mensaje, audioBase64, audioMime }) {
      currentId = id;
      const finalizar = crearFinalizador(id);
      finalizarActual = finalizar;
      let fallbackIniciado = false;
      const iniciarFallback = () => {
        if (fallbackIniciado) return;
        fallbackIniciado = true;
        limpiarReproductor();
        usarFallbackTTS(mensaje, finalizar);
      };

      elUsuario.textContent = usuario;
      elMensaje.textContent = mensaje;
      elBadge.textContent = colaLocal.length ? `+${colaLocal.length} en cola` : '';
      notif.style.display = 'flex';
      notif.classList.remove('saliendo');
      notif.classList.add('entrando');

      if (!audioBase64) {
        usarFallbackTTS(mensaje, finalizar);
        return;
      }

      audioActual = new Audio(`data:${audioMime || 'audio/mpeg'};base64,${audioBase64}`);
      audioActual.volume = 1;
      audioActual.addEventListener('loadedmetadata', () => {
        const duracion = Math.max(500, audioActual.duration * 1000);
        elBarra.style.transition = `transform ${duracion}ms linear`;
        void elBarra.offsetWidth;
        elBarra.style.transform = 'scaleX(0)';
      }, { once: true });
      audioActual.addEventListener('ended', () => finalizar(), { once: true });
      audioActual.addEventListener('error', () => {
        console.warn('Audio remoto invalido; usando voz del navegador');
        iniciarFallback();
      }, { once: true });
      audioActual.play().catch(() => {
        console.warn('Autoplay fallo; usando voz del navegador');
        iniciarFallback();
      });
    }

    function usarFallbackTTS(mensaje, finalizar) {
      const duracion = Math.max(2000, mensaje.length * 75);
      elBarra.style.transition = `transform ${duracion}ms linear`;
      void elBarra.offsetWidth;
      elBarra.style.transform = 'scaleX(0)';

      utteranceActual = new SpeechSynthesisUtterance(mensaje);
      utteranceActual.lang = currentConfig.voiceLang || 'es-ES';
      utteranceActual.rate = currentConfig.voiceRate || 1.05;
      utteranceActual.pitch = currentConfig.voicePitch || 1;
      const timeout = setTimeout(() => {
        window.speechSynthesis.cancel();
        finalizar();
      }, duracion + 4000);
      finalizar.setTimeoutFallback(timeout);
      utteranceActual.onend = () => finalizar();
      utteranceActual.onerror = () => finalizar();
      window.speechSynthesis.speak(utteranceActual);
    }

    cargarConfig();
    conectarWS();
    setInterval(cargarConfig, 15000);
  </script>
</body>

</html>
